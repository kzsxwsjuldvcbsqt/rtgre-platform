[tools]
actionlint = "1.7.12"
# amtool et promtool vérifient la configuration d'Alertmanager et les règles d'alerte.
"aqua:prometheus/alertmanager" = "0.35.0"
"aqua:prometheus/prometheus" = "3.16.0"
cosign = "3.1.4"
gh = "2.103.3"
gitleaks = "8.30.1"
helm = "4.3.2"
kubeconform = "0.8.0"
"pipx:checkov" = "3.4.6"
"pipx:oci-cli" = "3.96.3"
"pipx:pre-commit" = "4.7.0"
python = "3.13.18"
shellcheck = "0.11.0"
terraform = "1.17.2"
tflint = "0.66.0"
trivy = "0.76.2"
uv = "0.13.7"

# Ansible, Molecule et le SDK Oracle partagent un environnement virtuel propre au dépôt.
[env]
_.python.venv = { path = ".venv", create = true }

[tasks.ansible-deps]
description = "Installe les dépendances Python et les collections Ansible aux versions figées"
# Limite la recherche des collections au projet : sinon une copie ailleurs sur le poste suffit à
# faire sauter l'installation dans ansible/collections.
env = { ANSIBLE_COLLECTIONS_PATH = "ansible/collections" }
run = [
  "uv pip install --quiet -r ansible/requirements.txt",
  "ansible-galaxy collection install --upgrade -r ansible/requirements.yml -p ansible/collections",
]

[tasks.kubernetes-validate]
description = "Vérifie les charts de kubernetes/ : helm lint, rendu, kubeconform, alertes et signature des images"
run = [
  "scripts/ci/validate-kubernetes.sh",
  "scripts/ci/validate-alerting.sh",
  "scripts/ci/verify-image-signatures.sh",
]
