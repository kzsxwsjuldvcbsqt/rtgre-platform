  # kube-state-metrics : ancienne version de gRPC.
  - id: CVE-2026-84304
    paths:
      - kube-state-metrics
    statement: &ksm >-
      kube-state-metrics 2.20.0, dernière version publiée au 2026-11-21, est lié à une ancienne version de gRPC.
      Il n'expose aucun service gRPC et ne reçoit que Prometheus.
    expired_at: 2027-01-31
  - id: CVE-2026-84445
    paths:
      - kube-state-metrics
    statement: *ksm
    expired_at: 2027-01-31
  - id: GHSA-hrxh-6v49-42gf
    paths:
      - kube-state-metrics
    statement: *ksm
    expired_at: 2027-01-31

  # Grafana : module Tempo.
  - id: CVE-2026-21728
    paths:
      - usr/share/grafana/bin/grafana
    statement: &grafana >-
      Module Tempo lié dans Grafana 13.1.10, dernière version de la branche 13.1 ; les branches plus récentes
      portent davantage de vulnérabilités (ADR 0016). Grafana n'interroge aucun Tempo, est en lecture seule et
      n'est joignable que par le Bastion.
    expired_at: 2027-01-31
  - id: CVE-2026-28377
    paths:
      - usr/share/grafana/bin/grafana
    statement: *grafana
    expired_at: 2027-01-31

  # cert-manager et Kyverno : go-jose.
  - id: CVE-2026-116587
    paths:
      - app/cmd/controller/controller
      - ko-app/kyverno
      - ko-app/kyverno-init
    statement: >-
      Déni de service à la lecture d'une clé JWK, dans le contrôleur de cert-manager 1.21.3 et dans Kyverno
      1.20.0, leurs dernières versions publiées au 2026-11-22. Pour cert-manager, le correctif est fusionné dans
      la branche release-1.21 : la prochaine version corrective l'apportera. Kyverno ne lit que les signatures du
      registre déclaré et les certificats de Sigstore, seules adresses qu'il peut joindre.
    expired_at: 2027-01-31

  # Umami : gestionnaire de paquets embarqué, et une dépendance de son accès à la base.
  - id: CVE-2026-109383
    paths:
      - usr/local/lib/node_modules/pnpm/dist/node_modules/undici/package.json
    statement: &umami-pnpm >-
      Client HTTP undici embarqué dans pnpm, le gestionnaire de paquets que garde l'image d'Umami 3.5.0,
      dernière version publiée au 2026-11-22. Umami démarre et tourne sans lui, n'utilise pas cette copie, et
      n'a aucune sortie vers Internet.
    expired_at: 2027-01-31
  - id: CVE-2026-109869
    paths:
      - usr/local/lib/node_modules/pnpm/dist/node_modules/undici/package.json
    statement: *umami-pnpm
    expired_at: 2027-01-31
  - id: CVE-2026-19534
    paths:
      - usr/local/lib/node_modules/pnpm/dist/node_modules/undici/package.json
    statement: *umami-pnpm
    expired_at: 2027-01-31
  - id: CVE-2026-87018
    paths:
      - usr/local/lib/node_modules/pnpm/dist/node_modules/undici/package.json
    statement: *umami-pnpm
    expired_at: 2027-01-31
  - id: CVE-2026-121707
    paths:
      - app/node_modules/.pnpm/effect@3.20.0/node_modules/effect/package.json
    statement: >-
      Expression régulière coûteuse dans la bibliothèque effect, dépendance de l'accès à la base dans Umami
      3.5.0, dernière version publiée au 2026-11-22. Le tableau de bord n'est pas exposé, et la collecte
      n'accepte que deux chemins.
    expired_at: 2027-01-31

  # PostgreSQL : bibliothèque XML d'Alpine.
  - id: CVE-2026-86144
    statement: >-
      libxml2 dans l'image officielle de PostgreSQL 18.7, dernière version publiée au 2026-11-22. La base ne
      reçoit qu'Umami, qui ne lui envoie aucun document XML.
    expired_at: 2027-01-31
