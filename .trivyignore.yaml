# Exceptions de Trivy : chacune est justifiée et expire, pour être réexaminée.
misconfigurations:
  - id: DS-0002
    paths:
      - ansible/roles/*/molecule/default/Dockerfile.j2
    statement: >-
      Conteneurs de test Molecule : ils font tourner systemd et appliquent les rôles comme root sur un
      nœud. Ils ne sont jamais déployés.
    expired_at: 2027-11-21

vulnerabilities:
  # Images déployées par les charts de kubernetes/ (scripts/ci/scan-images.sh). Chaque exception
  # attend une version que l'éditeur n'a pas encore publiée : à l'échéance, l'analyse échoue de
  # nouveau et l'exception est réexaminée. « paths » la limite aux binaires concernés.

  # Go : bibliothèque standard et golang.org/x/net, dans presque toutes les images écrites en Go.
  - id: CVE-2026-97054
    statement: &go >-
      Dénis de service dans la bibliothèque standard de Go (réponses HTTP/1) et dans golang.org/x/net (analyse
      HTML). Presque toutes les images écrites en Go les portent : Prometheus, son opérateur, Alertmanager, la
      sonde, kube-state-metrics, cert-manager, Argo CD, Grafana, Loki et Alloy. Au 2026-11-21, aucune de leurs
      dernières versions n'est reconstruite avec le correctif. Hors du solveur de défis de cert-manager, joignable
      quelques secondes à chaque renouvellement, aucun de ces services ne reçoit de trafic d'Internet.
    expired_at: 2027-01-31
  - id: CVE-2026-78661
    statement: *go
    expired_at: 2027-01-31

  # Argo CD et kube-state-metrics : anciennes versions de Go.
  - id: CVE-2026-111943
    paths:
      - kube-state-metrics
      - usr/bin/pebble
      - usr/local/bin/kustomize
    statement: &argocd-ksm >-
      Outils embarqués dans l'image d'Argo CD 3.6.2 (pebble, git-lfs, kustomize) et binaire de kube-state-metrics
      2.20.0, construits avec d'anciennes versions de Go et de ses modules. Le binaire d'Argo CD n'est pas
      concerné. Ce sont les dernières versions publiées au 2026-11-21. Argo CD n'est joignable que par le Bastion,
      et kube-state-metrics ne reçoit que Prometheus.
    expired_at: 2027-01-31
  - id: CVE-2026-56851
    paths:
      - kube-state-metrics
      - usr/local/bin/git-lfs
    statement: *argocd-ksm
    expired_at: 2027-01-31
  - id: CVE-2026-56854
    paths:
      - kube-state-metrics
      - usr/local/bin/git-lfs
    statement: *argocd-ksm
    expired_at: 2027-01-31
  - id: CVE-2026-78667
    paths:
      - kube-state-metrics
      - usr/bin/pebble
      - usr/local/bin/kustomize
    statement: *argocd-ksm
    expired_at: 2027-01-31
  - id: CVE-2026-78669
    paths:
      - kube-state-metrics
