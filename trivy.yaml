# Configuration de Trivy, lue par « trivy config » et « trivy fs » depuis la racine du dépôt.
severity:
  - HIGH
  - CRITICAL
exit-code: 1
ignorefile: .trivyignore.yaml
scan:
  # Code tiers téléchargé localement : analysé par ses propres auteurs, pas par ce dépôt.
  skip-dirs:
    - .venv
    - ansible/collections
    - ansible/.ansible
    - "**/.terraform"
    - kubernetes/*/charts
    # Cache de pre-commit, placé dans le dépôt par la CI : il contient les dépôts des hooks.
    - .cache
