name: Kubernetes

on:
  push:
    branches:
      - main
    paths:
      - kubernetes/**
      - scripts/ci/validate-kubernetes.sh
      - ansible/inventories/prod/group_vars/all.yml
      - mise.toml
      - .github/workflows/kubernetes.yml
  pull_request:
    branches:
      - main
    paths:
      - kubernetes/**
      - scripts/ci/validate-kubernetes.sh
      - ansible/inventories/prod/group_vars/all.yml
      - mise.toml
      - .github/workflows/kubernetes.yml

permissions: {}

concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: '2026.11.11'

jobs:
  charts:
    name: Charts (helm, kubeconform)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}

      # Rend chaque chart pour la version de Kubernetes du cluster et valide les objets obtenus.
      - name: Lint, render and validate the charts
        run: scripts/ci/validate-kubernetes.sh
