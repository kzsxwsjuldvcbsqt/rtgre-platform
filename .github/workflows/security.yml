name: Security

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Une vulnérabilité peut être publiée sur une dépendance sans que le dépôt change.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
  MISE_VERSION: '2026.11.11'

jobs:
  trivy:
    name: Trivy (${{ matrix.scan }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scan:
          - config
          - vulnerabilities
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          version: ${{ env.MISE_VERSION }}

      # Règles, sévérités et exceptions : trivy.yaml et .trivyignore.yaml.
      - name: Scan for misconfigurations
        if: matrix.scan == 'config'
        run: trivy config .

      - name: Scan dependencies for known vulnerabilities
        if: matrix.scan == 'vulnerabilities'
        run: trivy fs --scanners vuln .
