[defaults]
inventory = inventories/prod
collections_path = collections
roles_path = roles
remote_user = ubuntu
interpreter_python = auto_silent
forks = 10
retry_files_enabled = False
callback_result_format = yaml

[inventory]
enable_plugins = oracle.oci.oci, ansible.builtin.yaml

[ssh_connection]
pipelining = True
# Les nœuds ne sont joignables que par le Bastion : voir scripts/bastion-ssh-config.sh.
ssh_args = -F .ssh/bastion.conf -o ControlMaster=auto -o ControlPersist=60s
