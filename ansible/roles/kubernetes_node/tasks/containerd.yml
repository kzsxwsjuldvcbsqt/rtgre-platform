---
# containerd vient de l'archive Ubuntu : il reste couvert par les mises à jour de sécurité.
- name: Install containerd
  ansible.builtin.apt:
    name: containerd
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

# Seules les valeurs qui diffèrent des défauts sont écrites : containerd complète le reste.
- name: Configure containerd for kubelet
  ansible.builtin.template:
    src: containerd-config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Point crictl at containerd
  ansible.builtin.template:
    src: crictl.yaml.j2
    dest: /etc/crictl.yaml
    owner: root
    group: root
    mode: "0644"

- name: Start containerd
  ansible.builtin.systemd_service:
    name: containerd
    enabled: true
    state: started
