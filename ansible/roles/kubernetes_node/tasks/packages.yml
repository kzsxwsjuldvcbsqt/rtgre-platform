---
# python3-debian est requis par deb822_repository ; ca-certificates sert à télécharger la clé du dépôt.
- name: Install the repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add the Kubernetes package repository
  ansible.builtin.deb822_repository:
    name: kubernetes
    types: deb
    uris: "{{ kubernetes_node_apt_repository_url | replace('{minor}', kubernetes_node_minor_version) }}"
    suites: /
    signed_by: "{{ kubernetes_node_apt_repository_url | replace('{minor}', kubernetes_node_minor_version) }}Release.key"
    state: present
  register: kubernetes_node_repository

- name: Refresh the package lists after adding the repository
  ansible.builtin.apt:
    update_cache: true
  when: kubernetes_node_repository is changed

# allow_change_held_packages permet de changer la version de paquets déjà bloqués.
- name: Install the Kubernetes packages at the requested version
  ansible.builtin.apt:
    name: "{{ kubernetes_node_packages | map('regex_replace', '$', '=' ~ kubernetes_node_version ~ '-*') | list }}"
    state: present
    allow_change_held_packages: true

- name: Hold the Kubernetes packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop: "{{ kubernetes_node_packages }}"

- name: Enable kubelet, which kubeadm configures and starts
  ansible.builtin.systemd_service:
    name: kubelet
    enabled: true
