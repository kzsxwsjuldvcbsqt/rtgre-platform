---
dependency:
  name: galaxy
  enabled: false

driver:
  name: docker

# Conteneur Ubuntu 24.04 avec systemd, pour faire tourner containerd comme sur un nœud.
platforms:
  - name: kubernetes-node-noble
    # Nom du tag local construit par le pilote ; l'image de base est épinglée dans Dockerfile.j2.
    image: ubuntu:24.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /lib/systemd/systemd
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs:
      - /run
      - /run/lock
      - /tmp

provisioner:
  name: ansible
  env:
    ANSIBLE_COLLECTIONS_PATH: ${MOLECULE_PROJECT_DIRECTORY}/../../collections
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  inventory:
    host_vars:
      kubernetes-node-noble:
        # Le conteneur partage le noyau et le swap de la machine hôte : rien n'y est appliqué,
        # seuls les fichiers de configuration sont écrits.
        kubernetes_node_load_modules: false
        kubernetes_node_sysctl_apply: false
        kubernetes_node_disable_swap: false

verifier:
  name: ansible
