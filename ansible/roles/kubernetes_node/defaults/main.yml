---
# Kubernetes ------------------------------------------------------------------

# Version exacte de kubeadm, kubelet et kubectl. Le dépôt apt suivi est celui de sa version mineure.
kubernetes_node_version: "1.37.2"

# Paquets Kubernetes installés, puis bloqués contre les mises à jour automatiques : une montée de
# version passe par kubeadm upgrade, nœud par nœud.
kubernetes_node_packages:
  - kubelet
  - kubeadm
  - kubectl

# Dépôt officiel des paquets Kubernetes ; {minor} est remplacé par la version mineure.
kubernetes_node_apt_repository_url: https://pkgs.k8s.io/core:/stable:/v{minor}/deb/

# containerd -------------------------------------------------------------------

# Image « pause » des sandboxes de pods ; elle doit correspondre à celle qu'attend kubeadm
# (kubeadm config images list).
kubernetes_node_pause_image: registry.k8s.io/pause:3.10.1

# Socket du runtime, utilisé par kubelet et crictl.
kubernetes_node_containerd_socket: unix:///run/containerd/containerd.sock

# Noyau --------------------------------------------------------------------------

# Modules nécessaires au réseau des pods et au système de fichiers des conteneurs.
kubernetes_node_kernel_modules:
  - overlay
  - br_netfilter

# Charge les modules dans le noyau en cours, en plus de les déclarer pour les démarrages suivants.
# Désactivé dans les tests en conteneur, qui partagent le noyau de la machine hôte.
kubernetes_node_load_modules: true

# Routage et filtrage du trafic des ponts réseau, requis par kubeadm.
kubernetes_node_sysctl:
  net.ipv4.ip_forward: 1
  net.bridge.bridge-nf-call-iptables: 1
  net.bridge.bridge-nf-call-ip6tables: 1

# Applique les paramètres au noyau en cours. Désactivé dans les tests en conteneur.
kubernetes_node_sysctl_apply: true

# kubelet refuse de démarrer avec un swap actif. Désactivé dans les tests en conteneur, où
# « swapoff » agirait sur la machine hôte.
kubernetes_node_disable_swap: true
