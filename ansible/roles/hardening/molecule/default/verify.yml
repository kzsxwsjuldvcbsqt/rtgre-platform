---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Read the effective SSH configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: hardening_sshd_effective
      changed_when: false

    - name: Check that SSH only accepts keys, without root, for the allowed users
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in hardening_sshd_effective.stdout_lines"
          - "'kbdinteractiveauthentication no' in hardening_sshd_effective.stdout_lines"
          - "'permitrootlogin no' in hardening_sshd_effective.stdout_lines"
          - "'authenticationmethods publickey' in hardening_sshd_effective.stdout_lines"
          - "'allowusers ubuntu' in hardening_sshd_effective.stdout_lines"
          - "'maxauthtries 3' in hardening_sshd_effective.stdout_lines"
          - "'x11forwarding no' in hardening_sshd_effective.stdout_lines"
        fail_msg: La configuration effective de sshd ne correspond pas au rôle.

    - name: Check that the SSH service is running
      ansible.builtin.systemd_service:
        name: ssh
      register: hardening_ssh_service

    - name: Assert the SSH service state
      ansible.builtin.assert:
        that:
          - hardening_ssh_service.status.ActiveState == 'active'

    - name: Read the firewall status
      ansible.builtin.command: ufw status verbose
      register: hardening_ufw_status
      changed_when: false

    - name: Check that the firewall denies incoming traffic except the allowed rules
      ansible.builtin.assert:
        that:
          - "'Status: active' in hardening_ufw_status.stdout"
          - "'Default: deny (incoming)' in hardening_ufw_status.stdout"
          - hardening_ufw_status.stdout is search('22/tcp\\s+ALLOW IN\\s+Anywhere')
          - hardening_ufw_status.stdout is search('443/tcp\\s+ALLOW IN\\s+Anywhere')
          - hardening_ufw_status.stdout is search('Anywhere\\s+ALLOW IN\\s+10\\.20\\.0\\.0/16')
        fail_msg: "Pare-feu inattendu : {{ hardening_ufw_status.stdout }}"

    - name: Read the routed traffic policy
      ansible.builtin.command: grep -E '^DEFAULT_FORWARD_POLICY=' /etc/default/ufw
      register: hardening_forward_policy
      changed_when: false

    - name: Check that routed traffic follows the requested policy
      ansible.builtin.assert:
        that:
          - hardening_forward_policy.stdout == 'DEFAULT_FORWARD_POLICY="ACCEPT"'

    - name: Read the ufw kernel parameters
      ansible.builtin.command: grep -E '^net/ipv4/conf/all/log_martians=' /etc/ufw/sysctl.conf
      register: hardening_ufw_sysctl
      changed_when: false

    - name: Check that ufw does not undo the hardening parameters
      ansible.builtin.assert:
        that:
          - hardening_ufw_sysctl.stdout == 'net/ipv4/conf/all/log_martians=1'

    - name: Read the filter rules
      ansible.builtin.command: iptables -S
      register: hardening_iptables
      changed_when: false

    - name: Check that the Oracle reject rules are gone
      ansible.builtin.assert:
        that:
          - "'-A INPUT -j REJECT --reject-with icmp-host-prohibited' not in hardening_iptables.stdout_lines"
          - "'-A FORWARD -j REJECT --reject-with icmp-host-prohibited' not in hardening_iptables.stdout_lines"

    - name: Gather installed packages
      ansible.builtin.package_facts:

    - name: Check packages
      ansible.builtin.assert:
        that:
          - "'iptables-persistent' not in ansible_facts.packages"
          - "'netfilter-persistent' not in ansible_facts.packages"
          - "'unattended-upgrades' in ansible_facts.packages"

    - name: Read the unattended-upgrades configuration
      ansible.builtin.slurp:
        src: /etc/apt/apt.conf.d/52unattended-upgrades-hardening
      register: hardening_upgrades_config

    - name: Check that only security updates are installed, without automatic reboot
      ansible.builtin.assert:
        that:
          - "'-security' in hardening_upgrades_config.content | b64decode"
          - "'-updates' not in hardening_upgrades_config.content | b64decode"
          - "'Automatic-Reboot \"false\"' in hardening_upgrades_config.content | b64decode"

    - name: Read the kernel parameters file
      ansible.builtin.slurp:
        src: /etc/sysctl.d/60-hardening.conf
      register: hardening_sysctl_file

    - name: Check the kernel parameters
      ansible.builtin.assert:
        that:
          - "'kernel.kptr_restrict=2' in hardening_sysctl_file.content | b64decode"
          - "'net.ipv4.conf.all.accept_redirects=0' in hardening_sysctl_file.content | b64decode"
