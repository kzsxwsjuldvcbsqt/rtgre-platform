---
# Reproduit les images Ubuntu d'Oracle Cloud, qui chargent des règles iptables au démarrage.
- name: Prepare
  hosts: all
  gather_facts: false
  tasks:
    - name: Preseed iptables-persistent to skip its interactive questions
      ansible.builtin.debconf:
        name: iptables-persistent
        question: "iptables-persistent/{{ item }}"
        value: "false"
        vtype: boolean
      loop:
        - autosave_v4
        - autosave_v6

    - name: Install iptables-persistent as on Oracle images
      ansible.builtin.apt:
        name: iptables-persistent
        state: present
        update_cache: true

    # Règles chargées au démarrage par les images Oracle : tout est rejeté sauf SSH.
    - name: Load the Oracle image firewall rules
      ansible.builtin.shell: |
        set -o pipefail
        iptables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT
        iptables -A INPUT -p icmp -j ACCEPT
        iptables -A INPUT -i lo -j ACCEPT
        iptables -A INPUT -p tcp -m state --state NEW -m tcp --dport 22 -j ACCEPT
        iptables -A INPUT -j REJECT --reject-with icmp-host-prohibited
        iptables -A FORWARD -j REJECT --reject-with icmp-host-prohibited
      args:
        executable: /bin/bash
      changed_when: true
