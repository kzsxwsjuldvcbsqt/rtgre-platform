---
- name: Install the OpenSSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# Avec l'activation par socket d'Ubuntu 24.04, sshd ne démarre qu'à la première connexion : ce
# dossier peut manquer juste après l'installation, et « sshd -t » échoue alors.
- name: Ensure the SSH privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/10-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart SSH

- name: Check the complete SSH configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
