---
- name: Remove the iptables rules preloaded by the Oracle image
  ansible.builtin.apt:
    name:
      - iptables-persistent
      - netfilter-persistent
    state: absent
    purge: true
  when: hardening_firewall_remove_iptables_persistent

# Retirer le paquet n'empêche que leur rechargement au prochain démarrage : les règles déjà
# chargées restent actives. Leurs REJECT, placés avant les chaînes d'ufw, rejetteraient tout sauf
# SSH (API Kubernetes, trafic des pods).
- name: Remove the reject rules loaded by the Oracle image
  ansible.builtin.iptables:
    chain: "{{ item }}"
    jump: REJECT
    reject_with: icmp-host-prohibited
    state: absent
  loop:
    - INPUT
    - FORWARD
  when: hardening_firewall_remove_iptables_persistent

- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Allow SSH before enabling the firewall
  community.general.ufw:
    rule: allow
    port: "{{ hardening_ssh_port | string }}"
    proto: tcp
    comment: SSH

- name: Allow trusted networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
    comment: Trusted network
  loop: "{{ hardening_firewall_trusted_cidrs }}"

- name: Allow public TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
    comment: Public service
  loop: "{{ hardening_firewall_public_tcp_ports }}"

# ufw applique son propre /etc/ufw/sysctl.conf à chaque démarrage et rechargement, après
# /etc/sysctl.d/ : il remettrait par exemple log_martians à 0. Les paramètres que ce fichier
# connaît déjà sont alignés sur hardening_sysctl ; les autres ne sont pas ajoutés.
- name: Align the ufw kernel parameters with the hardening ones
  ansible.builtin.lineinfile:
    path: /etc/ufw/sysctl.conf
    regexp: "^{{ item.key | replace('.', '/') }}="
    line: "{{ item.key | replace('.', '/') }}={{ item.value }}"
    backrefs: true
  loop: "{{ hardening_sysctl | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Reload ufw

- name: Deny incoming traffic by default and enable the firewall
  community.general.ufw:
    state: enabled
    direction: incoming
    default: deny

# Écrite dans /etc/default/ufw plutôt qu'avec le module ufw : tant que le routage IPv4 est
# désactivé, ufw affiche « disabled (routed) » et le module n'applique pas la politique demandée.
- name: Set the policy for routed traffic
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: "^DEFAULT_FORWARD_POLICY="
    line: 'DEFAULT_FORWARD_POLICY="{{ hardening_firewall_forward_policies[hardening_firewall_routed_policy] }}"'
  notify: Reload ufw
