---
# Configure tous les nœuds du cluster. À lancer depuis ansible/, après scripts/bastion-ssh-config.sh :
#   ansible-playbook playbooks/site.yml

- name: Check the platform network settings
  hosts: k8s_control_plane:k8s_worker
  gather_facts: true
  tasks:
    - name: Check that the node address belongs to the virtual network
      ansible.builtin.assert:
        that:
          - ansible_default_ipv4.address is ansible.utils.in_network(platform_vcn_cidr)
        fail_msg: >-
          {{ inventory_hostname }} ({{ ansible_default_ipv4.address }}) n'est pas dans {{ platform_vcn_cidr }} :
          platform_vcn_cidr ne correspond plus à vcn_cidr de terraform/envs/prod/prod.auto.tfvars.
        quiet: true

    - name: Check that the Kubernetes ranges overlap neither each other nor the virtual network
      ansible.builtin.assert:
        that:
          - not (platform_vcn_cidr | ansible.utils.network_in_network(kubernetes_pod_cidr))
          - not (kubernetes_pod_cidr | ansible.utils.network_in_network(platform_vcn_cidr))
          - not (platform_vcn_cidr | ansible.utils.network_in_network(kubernetes_service_cidr))
          - not (kubernetes_service_cidr | ansible.utils.network_in_network(platform_vcn_cidr))
          - not (kubernetes_pod_cidr | ansible.utils.network_in_network(kubernetes_service_cidr))
          - not (kubernetes_service_cidr | ansible.utils.network_in_network(kubernetes_pod_cidr))
        fail_msg: Les plages du réseau virtuel, des pods et des services se chevauchent.
        quiet: true
      run_once: true

- name: Harden the nodes and prepare them for kubeadm
  hosts: k8s_control_plane:k8s_worker
  become: true
  roles:
    - role: hardening
    - role: kubernetes_node

- name: Initialize the control plane and the pod network
  hosts: k8s_control_plane
  become: true
  pre_tasks:
    - name: Check that the cluster has exactly one control plane
      ansible.builtin.assert:
        that:
          - groups['k8s_control_plane'] | length == 1
        fail_msg: Le cluster doit avoir exactement un plan de contrôle (ADR 0003).
        quiet: true
  roles:
    - role: kubeadm
    - role: cilium

- name: Join the workers
  hosts: k8s_worker
  become: true
  roles:
    - role: kubeadm

- name: Check that every node is ready
  hosts: k8s_control_plane
  become: true
  tasks:
    - name: Wait for all nodes to be ready
      ansible.builtin.command: >-
        kubectl --kubeconfig /etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=300s
      changed_when: false

# Argo CD a besoin d'un nœud de travail prêt : il passe après la jonction.
- name: Hand the cluster over to Argo CD
  hosts: k8s_control_plane
  become: true
  roles:
    - role: argocd
