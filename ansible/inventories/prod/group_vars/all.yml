---
# Utilisateur par défaut des images Ubuntu d'Oracle Cloud.
ansible_user: ubuntu

# Réseau ------------------------------------------------------------------------

# Plage du réseau virtuel, définie dans terraform/envs/prod/prod.auto.tfvars (vcn_cidr).
# Le playbook vérifie que chaque nœud y a bien son adresse.
platform_vcn_cidr: 10.20.0.0/16

# Plages internes de Kubernetes. Elles ne doivent chevaucher ni le réseau virtuel ni entre elles.
kubernetes_pod_cidr: 10.244.0.0/16
kubernetes_service_cidr: 10.96.0.0/12

# Durcissement --------------------------------------------------------------------

# Le trafic entre nœuds et celui des pods vers les nœuds ne passe pas par Internet : il est admis.
hardening_firewall_trusted_cidrs:
  - "{{ platform_vcn_cidr }}"
  - "{{ kubernetes_pod_cidr }}"

# Le trafic des pods traverse la chaîne FORWARD des nœuds.
hardening_firewall_routed_policy: allow

# Un nœud redémarre seul, la nuit, quand une mise à jour de sécurité l'exige (ADR 0023). Les
# nœuds sont à l'heure UTC : 3 h 40 tombe à 4 h 40 ou 5 h 40 à Paris, après la génération de
# l'heure et la conservation des journaux du lundi. Le plan de contrôle passe une demi-heure
# avant (group_vars/k8s_control_plane.yml) : jamais les deux à la fois.
hardening_unattended_upgrades_automatic_reboot: true
hardening_unattended_upgrades_automatic_reboot_time: "03:40"

# node-exporter lit ce dossier : il n'est écrit qu'à un endroit, dans les valeurs de son chart.
hardening_reboot_required_metric_directory: >-
  {{ (lookup('ansible.builtin.file', playbook_dir ~ '/../../kubernetes/node-exporter/values.yaml')
      | from_yaml).textfileDirectory }}

# Kubernetes ---------------------------------------------------------------------

# Cilium 1.20 n'est testé qu'avec Kubernetes 1.33 à 1.36 : la dernière 1.36 est retenue (ADR 0009).
# renovate: datasource=github-releases depName=kubernetes/kubernetes extractVersion=^v(?<version>.+)$
kubernetes_node_version: "1.36.6"

kubeadm_cluster_name: rtgre-platform
kubeadm_kubernetes_version: "{{ kubernetes_node_version }}"
kubeadm_pod_cidr: "{{ kubernetes_pod_cidr }}"
kubeadm_service_cidr: "{{ kubernetes_service_cidr }}"
kubeadm_control_plane_host: "{{ groups['k8s_control_plane'] | first }}"
kubeadm_node_role: "{{ freeform_tags['kubernetes-role'] }}"

cilium_kubernetes_version: "{{ kubernetes_node_version }}"

argocd_kubernetes_version: "{{ kubernetes_node_version }}"
# Une clé de déploiement par cluster : son titre le désigne dans le dépôt GitHub.
argocd_deploy_key_title: "argocd-{{ kubeadm_cluster_name }}"

# Stockage -----------------------------------------------------------------------

# Les volumes locaux ne sont déclarés que dans les valeurs du chart storage : chaque nœud crée
# les dossiers des volumes qu'il porte.
platform_storage_values: >-
  {{ lookup('ansible.builtin.file', playbook_dir ~ '/../../kubernetes/storage/values.yaml') | from_yaml }}
local_volumes_directory: "{{ platform_storage_values.directory }}"
local_volumes_names: >-
  {{ platform_storage_values.volumes | dict2items
     | selectattr('value.node', 'equalto', inventory_hostname) | map(attribute='key') }}
