# nginx sert le site généré, sans privilège : aucun port sous 1024, et tout ce qu'il écrit
# va dans /tmp, seul dossier inscriptible du conteneur.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Types absents de la liste de nginx. Sans le sien, un module JavaScript (.mjs) est refusé par
  # le navigateur, et la lecture des relevés PDF ne fonctionne plus.
  types {
    application/javascript mjs;
    text/calendar ics;
    text/markdown md;
  }
  charset utf-8;
  charset_types text/css text/plain text/calendar text/markdown application/javascript application/json;

  # L'adresse du visiteur arrive dans X-Forwarded-For, posé par la passerelle : elle est la
  # seule à pouvoir joindre ce serveur (NetworkPolicy), et elle écarte l'en-tête qu'enverrait
  # un visiteur.
  set_real_ip_from 0.0.0.0/0;
  real_ip_header X-Forwarded-For;

  # Seule une adresse tronquée est journalisée (ADR 0014) : les trois premiers octets en IPv4
  # (/24), les trois premiers groupes en IPv6 (/48). Tout ce qui ne se reconnaît pas donne « - ».
  map $remote_addr $visitor_network {
    default                                                -;
    "~^(?<net>\d+\.\d+\.\d+)\.\d+$"                     $net.0;
    "~^(?<net>[0-9a-f]+:[0-9a-f]+:[0-9a-f]+):"             $net::;
    "~^(?<net>[0-9a-f]+:[0-9a-f]+)::"                      $net::;
    "~^(?<net>[0-9a-f]+)::"                                $net::;
  }

  # Les sondes ne sont pas des visites : celle de kubelet, et celle qui interroge le site chaque
  # minute depuis le cluster (kubernetes/monitoring).
  map $http_user_agent $is_visit {
    default        1;
    "~^kube-probe" 0;
    "~^Blackbox"   0;
  }

  log_format visits '$time_iso8601 $visitor_network "$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" $request_time';
  access_log /dev/stdout visits if=$is_visit;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/calendar text/markdown application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /srv/site/dist;
    index index.html;
    # Une redirection vers un dossier ne doit pas révéler le port interne.
    absolute_redirect off;

    # Même durée de cache que GitHub Pages.
    expires 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Comme GitHub Pages : /page sert page.html.
    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    # Fichiers cachés du générateur (marqueur, verrou).
    location ~ /\. {
      return 404;
    }

    # Sonde de vie : nginx répond, que le site existe ou non.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
