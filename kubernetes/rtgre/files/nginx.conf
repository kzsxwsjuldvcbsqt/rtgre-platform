# nginx sert le site généré, sans privilège : aucun port sous 1024, et tout ce qu'il écrit
# va dans /tmp, seul dossier inscriptible du conteneur.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  # Types absents de la liste de nginx. Sans le sien, un module JavaScript (.mjs) est refusé par
  # le navigateur, et la lecture des relevés PDF ne fonctionne plus.
  types {
    application/javascript mjs;
    text/calendar ics;
  }
  charset utf-8;
  charset_types text/css text/plain text/calendar application/javascript application/json;

  # Aucune adresse IP n'est journalisée (confidentialité du site).
  log_format anonymous '$time_iso8601 "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent" $request_time';
  access_log /dev/stdout anonymous;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  server_tokens off;
  sendfile on;
  tcp_nopush on;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/calendar application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /srv/site/dist;
    index index.html;
    # Une redirection vers un dossier ne doit pas révéler le port interne.
    absolute_redirect off;

    # Même durée de cache que GitHub Pages.
    expires 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Comme GitHub Pages : /page sert page.html.
    location / {
      try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
      internal;
    }

    # Fichiers cachés du générateur (marqueur, verrou).
    location ~ /\. {
      return 404;
    }

    # Sonde de vie : nginx répond, que le site existe ou non.
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }
  }
}
