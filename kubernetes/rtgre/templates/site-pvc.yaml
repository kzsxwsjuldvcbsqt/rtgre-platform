apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.site.claimName }}
  labels:
    {{- include "rtgre.labels" . | nindent 4 }}
spec:
  storageClassName: {{ .Values.site.storageClass }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.site.size }}
