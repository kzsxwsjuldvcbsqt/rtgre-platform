apiVersion: v1
kind: Service
metadata:
  name: rtgre-web
  labels:
    {{- include "rtgre.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    app.kubernetes.io/name: rtgre
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
