# Le site s'attache à la passerelle du cluster : elle lui envoie les requêtes de ses noms.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rtgre
  labels:
    {{- include "rtgre.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
      sectionName: {{ .Values.gateway.listener }}
  hostnames:
    {{- toYaml .Values.hostnames | nindent 4 }}
  rules:
    - filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: Strict-Transport-Security
                value: {{ .Values.hsts }}
      backendRefs:
        - name: rtgre-web
          port: 80
