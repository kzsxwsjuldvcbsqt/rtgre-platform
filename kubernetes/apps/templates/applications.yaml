{{- range $name, $app := .Values.applications }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.argocdNamespace }}
  {{- if $app.cascade }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
  {{- end }}
spec:
  project: {{ $.Values.project }}
  source:
    {{- with $app.source }}
    repoURL: {{ .repoURL }}
    targetRevision: {{ .targetRevision }}
    path: {{ .path }}
    {{- else }}
    repoURL: {{ $.Values.repository.url }}
    targetRevision: {{ $.Values.repository.revision }}
    path: {{ $.Values.repository.path }}/{{ $name }}
    helm:
      releaseName: {{ $name }}
      {{- if $app.skipCrds }}
      skipCrds: true
      {{- end }}
    {{- end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Une application qui attend les objets d'une autre (des CRD, un volume) réessaie.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    {{- with $app.namespaceLabels }}
    managedNamespaceMetadata:
      labels:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      # Sur un cluster neuf, des applications s'attendent l'une l'autre : cert-manager déclare
      # une cible à Prometheus, dont le chart demande un certificat à cert-manager. Sans cette
      # option, Argo CD refuse toute la synchronisation dès qu'un type d'objet lui est inconnu,
      # et aucune des deux ne démarre. Avec elle, il applique ce qu'il peut, et le reste au
      # passage suivant.
      - SkipDryRunOnMissingResource=true
      {{- if $app.serverSideApply }}
      - ServerSideApply=true
      {{- end }}
{{- end }}
