# Dépôt que suit Argo CD. Il y accède en SSH avec une clé de déploiement en lecture seule,
# que le rôle Ansible argocd crée à l'amorçage.
repository:
  url: git@github.com:kzsxwsjuldvcbsqt/rtgre-platform.git
  revision: main
  # Dossier des charts de la plateforme dans le dépôt.
  path: kubernetes

# Projet Argo CD qui regroupe les applications de la plateforme.
project: platform

# Espace de noms où tourne Argo CD et où vivent ses objets Application.
argocdNamespace: argocd

# Applications de la plateforme. Chaque clé est le nom de l'application, et aussi celui du
# dossier de son chart sous repository.path.
#   namespace       : espace de noms de destination
#   namespaceLabels : étiquettes posées sur cet espace de noms (niveau Pod Security, etc.)
#   cascade         : true supprime les ressources quand l'application disparaît du dépôt
#   serverSideApply : true pour les objets trop grands pour l'annotation de kubectl (CRD)
#   skipCrds        : true pour ne pas installer les CRD que le chart embarque
#   source          : dépôt, révision et dossier d'une source extérieure, à la place du chart
#                     de ce dépôt
applications:
  argocd:
    namespace: argocd
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    # Argo CD ne se désinstalle pas lui-même si son application est retirée par erreur.
    cascade: false
    serverSideApply: true
  # Classe de stockage et PersistentVolume : aucun objet dans un espace de noms, celui
  # d'Argo CD sert seulement de destination.
  storage:
    namespace: argocd
    cascade: true
  # Certificats : cert-manager et ses émetteurs Let's Encrypt. Retirer l'application ne
  # supprime rien : ses CRD emporteraient les certificats.
  cert-manager:
    namespace: cert-manager
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    cascade: false
    serverSideApply: true
  # Passerelle du cluster : Traefik en contrôleur Gateway API. Ses propres CRD (IngressRoute)
  # ne sont pas installées : il ne sert que Gateway API.
  gateway:
    namespace: gateway
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    cascade: true
    skipCrds: true
  # CRD de Gateway API, canal standard, lues dans le dépôt officiel au commit de la version que
  # Traefik prend en charge (kubernetes/gateway/Chart.yaml). Retirer l'application ne les
  # supprime pas : elles emporteraient toutes les passerelles et les routes.
  gateway-api:
    namespace: argocd
    cascade: false
    serverSideApply: true
    source:
      repoURL: https://github.com/kubernetes-sigs/gateway-api
      # renovate-digest: datasource=github-tags depName=kubernetes-sigs/gateway-api
      targetRevision: c0836133e24073fcdcdbb1713aba3cc73a89d0b5 # v1.6.3
      path: config/crd/standard
  rtgre:
    namespace: rtgre
    namespaceLabels:
      pod-security.kubernetes.io/enforce: restricted
    cascade: true
