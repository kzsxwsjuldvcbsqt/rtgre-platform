# Umami mesure l'audience du site (ADR 0025). Seule la collecte est exposée, sous le nom du site ;
# le tableau de bord ne s'ouvre que par le Bastion (README de ce chart).
umami:
  image:
    repository: ghcr.io/umami-software/umami
    tag: 3.5.0@sha256:b64f40400d77bcadd39cf5c62a1e368c99524ca442024f96e1133355a19a5dbc
  # Utilisateur de l'image.
  user: 1001
  port: 3000
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 512Mi

# Base de données d'Umami, sur un volume local.
postgres:
  image:
    repository: docker.io/library/postgres
    tag: 18.7-alpine3.24@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
  # Utilisateur « postgres » de l'image : elle démarre sans root, et sans son outil gosu.
  user: 70
  port: 5432
  database: umami
  username: umami
  # Volume déclaré dans kubernetes/storage/values.yaml, sous la demande data-umami-postgres-0.
  storage:
    storageClass: local
    size: 2Gi
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 384Mi

# Sauvegarde de la base vers Object Storage, chaque nuit (ADR 0026). Le pod dépose avec l'identité
# de son nœud : aucun secret d'Oracle n'entre dans le cluster.
backup:
  image:
    repository: docker.io/rclone/rclone
    tag: 1.76.0@sha256:7cbeec24a44f206067597c0368be4de90ae19a64d5113c7d1938bd737a81e466
  # Avant le redémarrage nocturne des nœuds, à l'heure de Paris.
  schedule: "20 2 * * *"
  timeZone: Europe/Paris
  # Une sauvegarde dure quelques secondes.
  activeDeadlineSeconds: 600
  # Région d'Oracle du bucket : les deux seuls noms que le pod joint en sortie en découlent.
  region: eu-paris-1
  # Dossier du bucket qui reçoit les sauvegardes d'Umami.
  prefix: umami
  # ConfigMap créé hors du dépôt par scripts/umami-backup-config.sh : le bucket (bucket) et le
  # namespace Object Storage de la tenancy (namespace), lus dans les sorties du bootstrap.
  configName: umami-backup
  # Place laissée à la sauvegarde avant son dépôt.
  scratchSize: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

# Service de métadonnées d'Oracle, où un pod obtient l'identité de son nœud. Il est fermé à tous
# les pods du cluster, sauf à ceux qui portent cette étiquette.
instanceIdentity:
  address: 169.254.169.254
  port: 80
  label: rtgre.fr/instance-identity
  value: allowed

# Secret créé hors du dépôt par scripts/umami-secret.sh : le mot de passe de la base
# (postgres-password) et la clé qui signe les sessions du tableau de bord (app-secret).
secretName: umami

# Collecte : ce que le navigateur d'un visiteur appelle, sous le nom du site. Rien d'autre
# d'Umami n'est joignable d'Internet.
collect:
  gateway:
    namespace: gateway
    name: public
    listener: websecure
  # Noms du site (hostnames dans kubernetes/rtgre/values.yaml).
  hostnames:
    - rtgre.fr
    - test.rtgre.fr
  # Chemin public du script, que la passerelle réécrit vers celui d'Umami.
  script:
    path: /mesure.js
    backendPath: /script.js
  # Point d'envoi des visites : le script d'Umami l'appelle sous ce chemin, sur le nom du site.
  endpoint:
    path: /api/send
