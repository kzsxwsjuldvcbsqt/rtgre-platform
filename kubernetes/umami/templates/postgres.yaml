apiVersion: v1
kind: Service
metadata:
  name: umami-postgres
  labels:
    app.kubernetes.io/name: umami-postgres
spec:
  selector:
    app.kubernetes.io/name: umami-postgres
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: umami-postgres
  labels:
    app.kubernetes.io/name: umami-postgres
spec:
  serviceName: umami-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: umami-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: umami-postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "umami.podSecurityContext" .Values.postgres.user | nindent 8 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: postgres-password
            # Un sous-dossier du volume : PostgreSQL refuse un dossier de données qui n'est pas vide
            # ou qui ne lui appartient pas.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - --username={{ .Values.postgres.username }}
                - --dbname={{ .Values.postgres.database }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - --username={{ .Values.postgres.username }}
                - --dbname={{ .Values.postgres.database }}
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        storageClassName: {{ .Values.postgres.storage.storageClass }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
