# Seuls deux chemins d'Umami sont joignables d'Internet, sous le nom du site : le script que
# charge la page, sous un nom que la passerelle réécrit, et le point où il envoie chaque visite.
# Le tableau de bord et le reste de son API n'ont aucune route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: umami-collect
  labels:
    app.kubernetes.io/name: umami
spec:
  parentRefs:
    - name: {{ .Values.collect.gateway.name }}
      namespace: {{ .Values.collect.gateway.namespace }}
      sectionName: {{ .Values.collect.gateway.listener }}
  hostnames:
    {{- toYaml .Values.collect.hostnames | nindent 4 }}
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: {{ .Values.collect.script.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: {{ .Values.collect.script.backendPath }}
      backendRefs:
        - name: umami
          port: {{ .Values.umami.port }}
    - matches:
        - method: POST
          path:
            type: Exact
            value: {{ .Values.collect.endpoint.path }}
      backendRefs:
        - name: umami
          port: {{ .Values.umami.port }}
