# Valeurs du chart officiel argo-cd. Installation minimale (ADR 0010) : pas de Dex, pas de
# notifications, pas d'ApplicationSet, Redis sans haute disponibilité.
argo-cd:
  global:
    # L'interface n'est pas exposée : elle s'ouvre par une redirection de port à travers le
    # Bastion (docs/runbooks/acceder-a-argocd.md).
    domain: localhost:8080
    networkPolicy:
      create: true
      defaultDenyIngress: true

  configs:
    cm:
      # Un seul compte, admin, joignable seulement à travers le Bastion.
      admin.enabled: true
      exec.enabled: false
      statusbadge.enabled: false

  dex:
    enabled: false

  notifications:
    enabled: false

  # L'application racine suffit à décrire les applications : pas de générateur.
  applicationSet:
    replicas: 0

  # Les demandes réservent le minimum mesuré, les limites de mémoire protègent le nœud de
  # travail (6 Go). Pas de limite de processeur : elle ralentirait les synchronisations sans
  # protéger le nœud.
  controller:
    # Métriques : état de synchronisation et de santé de chaque application.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 768Mi

  repoServer:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi

  server:
    resources:
      requests:
        cpu: 25m
        memory: 96Mi
      limits:
        memory: 256Mi

  redis:
    # La version que fixe le chart (8.6.4) porte onze vulnérabilités HIGH dans ses paquets
    # Alpine ; cette version corrective de la même branche n'en porte aucune.
    image:
      repository: ecr-public.aws.com/docker/library/redis
      tag: 8.6.8-alpine@sha256:91c71f9ea78fa3fe268ff832a985c48e592244f707993773f8b3e1b244ac1137
    resources:
      requests:
        cpu: 25m
        memory: 32Mi
      limits:
        memory: 128Mi
