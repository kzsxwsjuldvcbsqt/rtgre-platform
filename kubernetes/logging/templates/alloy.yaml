apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
automountServiceAccountToken: false
---
# Lire les journaux de tous les pods, et rien d'autre : ni secret, ni écriture.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logging-alloy
  labels:
    app.kubernetes.io/name: alloy
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logging-alloy
  labels:
    app.kubernetes.io/name: alloy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logging-alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
data:
  config.alloy: |
    {{- tpl (.Files.Get "files/config.alloy.tpl") . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: http
      port: {{ .Values.alloy.port }}
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
spec:
  # Un seul lecteur : deux enverraient chaque ligne en double.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
      annotations:
        checksum/config: {{ tpl (.Files.Get "files/config.alloy.tpl") . | sha256sum }}
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: true
      securityContext:
        {{- include "logging.podSecurityContext" .Values.alloy.user | nindent 8 }}
      containers:
        - name: alloy
          image: {{ .Values.alloy.image.repository }}:{{ .Values.alloy.image.tag }}
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/tmp/alloy
            - --server.http.listen-addr=0.0.0.0:{{ .Values.alloy.port }}
            - --disable-reporting
          securityContext:
            {{- include "logging.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.alloy.port }}
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.alloy.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: alloy
        - name: tmp
          emptyDir: {}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  endpoints:
    - port: http
      interval: 60s
