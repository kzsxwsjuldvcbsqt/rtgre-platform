# Par défaut, rien n'entre dans l'espace de noms et rien n'en sort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Prometheus, son opérateur et kube-state-metrics lisent l'API de Kubernetes. Grafana, non.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: to-kube-apiserver
spec:
  endpointSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - prometheus
          - kube-state-metrics
          - kube-prometheus-stack-prometheus-operator
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# Prometheus ne sort que vers ce qu'il collecte : kubelet et node-exporter sur les nœuds, puis
# les cibles listées dans les valeurs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-to-targets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            {{- range .Values.scrape.nodePorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    # Résolution du nom de service de la sonde, que Prometheus interroge par son nom.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    {{- range .Values.scrape.pods }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .namespace }}
            {{- range $key, $value := .labels }}
            {{ $key }}: {{ $value }}
            {{- end }}
      toPorts:
        - ports:
            - port: {{ .port | quote }}
              protocol: TCP
    {{- end }}
---
# Dans cet espace de noms, les métriques de kube-state-metrics et de l'opérateur ne sont lues
# que par Prometheus.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics-from-prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# L'opérateur reçoit Prometheus, pour ses métriques, et l'API de Kubernetes, qui lui fait
# valider les règles. Elle tourne sur le plan de contrôle : ses appels arrivent d'un nœud.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operator-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
# Grafana n'interroge que Prometheus, et ne reçoit que lui, pour ses propres métriques. Son
# interface s'ouvre par une redirection de port, qui ne passe pas par ces règles.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Résolution du nom de service de Prometheus. Tous les noms sont admis : le résolveur essaie
    # plusieurs suffixes, et de toute façon Grafana ne peut joindre que Prometheus.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
---
# Prometheus reçoit les requêtes de Grafana.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-from-grafana
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# La sonde ne reçoit que Prometheus, et ne sort que vers les noms qu'elle interroge, en HTTPS.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blackbox
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9115"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toFQDNs:
        {{- range .Values.probes.targets }}
        - matchName: {{ (urlParse .).host }}
        {{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
