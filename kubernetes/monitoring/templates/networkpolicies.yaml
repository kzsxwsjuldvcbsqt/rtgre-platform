# Par défaut, rien n'entre dans l'espace de noms et rien n'en sort.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Prometheus, son opérateur et kube-state-metrics lisent l'API de Kubernetes.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: to-kube-apiserver
spec:
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
# Prometheus ne sort que vers ce qu'il collecte : kubelet et node-exporter sur les nœuds, puis
# les cibles listées dans les valeurs.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-to-targets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            {{- range .Values.scrape.nodePorts }}
            - port: {{ . | quote }}
              protocol: TCP
            {{- end }}
    {{- range .Values.scrape.pods }}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .namespace }}
            {{- range $key, $value := .labels }}
            {{ $key }}: {{ $value }}
            {{- end }}
      toPorts:
        - ports:
            - port: {{ .port | quote }}
              protocol: TCP
    {{- end }}
---
# Dans cet espace de noms, les métriques de kube-state-metrics et de l'opérateur ne sont lues
# que par Prometheus.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics-from-prometheus
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
# L'opérateur reçoit Prometheus, pour ses métriques, et l'API de Kubernetes, qui lui fait
# valider les règles. Elle tourne sur le plan de contrôle : ses appels arrivent d'un nœud.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: operator-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: prometheus-operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
