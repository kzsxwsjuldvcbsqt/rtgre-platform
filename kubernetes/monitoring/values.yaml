# Ce que Prometheus a le droit de joindre, en plus de l'API de Kubernetes. Une cible ajoutée par
# un chart n'est collectée que si elle figure ici.
scrape:
  # Ports des nœuds : kubelet, et node-exporter (kubernetes/node-exporter).
  nodePorts:
    - 10250
    - 9100
  # Pods, par espace de noms, étiquettes et port.
  pods:
    - namespace: kube-system
      labels:
        k8s-app: kube-dns
      port: 9153
    - namespace: monitoring
      labels:
        app.kubernetes.io/name: kube-state-metrics
      port: 8080
    - namespace: monitoring
      labels:
        app.kubernetes.io/component: prometheus-operator
      port: 10250
    - namespace: monitoring
      labels:
        app.kubernetes.io/name: grafana
      port: 3000
    - namespace: monitoring
      labels:
        app.kubernetes.io/name: prometheus-blackbox-exporter
      port: 9115
    # Alertmanager : Prometheus lui envoie les alertes et lit ses métriques, puis celles du
    # conteneur qui recharge sa configuration.
    - namespace: monitoring
      labels:
        app.kubernetes.io/name: alertmanager
      port: 9093
    - namespace: monitoring
      labels:
        app.kubernetes.io/name: alertmanager
      port: 8080
    # Passerelle, certificats et Argo CD : chacun laisse entrer Prometheus dans son chart.
    - namespace: gateway
      labels:
        app.kubernetes.io/name: traefik
      port: 9100
    - namespace: cert-manager
      labels:
        app.kubernetes.io/instance: cert-manager
      port: 9402
    - namespace: argocd
      labels:
        app.kubernetes.io/name: argocd-application-controller
      port: 8082
    - namespace: kyverno
      labels:
        app.kubernetes.io/component: admission-controller
      port: 8000
    - namespace: logging
      labels:
        app.kubernetes.io/name: loki
      port: 3100
    - namespace: logging
      labels:
        app.kubernetes.io/name: alloy
      port: 12345

# Adresses que la sonde interroge chaque minute, en suivant les redirections : disponibilité,
# temps de réponse et date d'expiration du certificat. Elle ne peut joindre que ces noms.
probes:
  targets:
    - https://rtgre.fr/
    - https://www.rtgre.fr/

# Alertes (ADR 0018). Les règles sont dans files/alerts.yaml.
alerting:
  # Chaque alerte renvoie à un runbook de ce dossier.
  runbookBaseUrl: https://github.com/kzsxwsjuldvcbsqt/rtgre-platform/blob/main/docs/runbooks
  email:
    # Serveur d'envoi d'Oracle, seule adresse qu'Alertmanager peut joindre hors du cluster, et
    # adresse d'expédition : sortie alert_mail de terraform/bootstrap.
    smarthost: &smarthost smtp.email.eu-paris-1.oci.oraclecloud.com:587
    from: &mailFrom cluster@alertes.rtgre.fr
    # Secret créé hors du dépôt par scripts/alertmanager-email.sh : l'identifiant et le mot de
    # passe SMTP (smtp-username, smtp-password), et l'adresse qui reçoit les alertes (recipient).
    secretName: &emailSecret alertmanager-email

# Valeurs du chart officiel prometheus-blackbox-exporter.
prometheus-blackbox-exporter:
  fullnameOverride: monitoring-blackbox
  podSecurityContext:
    seccompProfile:
      type: RuntimeDefault
  config:
    modules:
      http_2xx:
        prober: http
        timeout: 10s
        http:
          # Le cluster n'a pas d'IPv6.
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
          follow_redirects: true
          # Une réponse en clair est un échec : le site doit être servi en HTTPS.
          fail_if_not_ssl: true
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

# Valeurs du chart officiel kube-prometheus-stack (ADR 0015).
kube-prometheus-stack:
  fullnameOverride: monitoring

  # Grafana, en lecture seule et sans aucun compte (README de ce chart). Tout ce qu'il affiche
  # vient du dépôt : la source de données ci-dessous, et les tableaux de bord de files/dashboards.
  grafana:
    enabled: true
    # La branche 13.1, encore maintenue, porte bien moins de vulnérabilités connues que la 13.3
    # (ADR 0016).
    image:
      registry: docker.io
      repository: grafana/grafana
      tag: 13.1.10@sha256:467fa061e60b09f4011c6f84620b9ec8805b077f85dfb2b76c5bdbc35b1b1a8f

    # Aucun compte : ni administrateur créé au démarrage, ni formulaire de connexion. Quiconque
    # atteint l'interface, donc quiconque passe le Bastion, lit les tableaux de bord sans rien
    # pouvoir modifier.
    env:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    grafana.ini:
      auth:
        disable_login_form: true
      auth.anonymous:
        enabled: true
        org_role: Viewer
      auth.basic:
        enabled: false
      # Aucune sortie vers Internet : ni statistiques, ni recherche de mises à jour, ni actualités.
      analytics:
        reporting_enabled: false
        check_for_updates: false
        check_for_plugin_updates: false
      news:
        news_feed_enabled: false
      # Grafana voudrait télécharger des extensions au démarrage : il n'a pas accès à Internet.
      plugins:
        preinstall_disabled: true
      dashboards:
        default_home_dashboard_path: /var/lib/grafana/dashboards/plateforme/rtgre.json

    # Pas de conteneur auxiliaire qui surveille l'API de Kubernetes : la source de données et les
    # tableaux de bord sont montés tels quels, et Grafana n'a aucun jeton de l'API.
    sidecar:
      dashboards:
        enabled: false
      datasources:
        enabled: false
        defaultDatasourceEnabled: false
    defaultDashboardsEnabled: false
    serviceAccount:
      automountServiceAccountToken: false
    automountServiceAccountToken: false
    rbac:
      create: false
    testFramework:
      enabled: false

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://monitoring-prometheus.monitoring.svc:9090
            isDefault: true
            editable: false
            jsonData:
              timeInterval: 60s
          # Journaux des pods (kubernetes/logging).
          - name: Loki
            uid: loki
            type: loki
            access: proxy
            url: http://loki.logging.svc:3100
            editable: false
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: plateforme
            type: file
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards/plateforme
    extraConfigmapMounts:
      - name: dashboards
        configMap: monitoring-dashboards
        mountPath: /var/lib/grafana/dashboards/plateforme
        readOnly: true

    # Mesuré à 239 Mo pendant l'affichage des tableaux de bord.
    resources:
      requests:
        cpu: 20m
        memory: 192Mi
      limits:
        memory: 384Mi

  # Alertmanager envoie les alertes par courrier. L'identifiant SMTP et le destinataire ne sont
  # pas dans le dépôt : le conteneur qui prépare la configuration remplace $(SMTP_USERNAME) et
  # $(ALERT_RECIPIENT) par les valeurs du Secret.
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules: []
      route:
        receiver: email
        # Un message par alerte, qui regroupe ses occurrences (deux nœuds, plusieurs pods).
        group_by:
          - alertname
        group_wait: 30s
        group_interval: 5m
        # Une alerte qui dure est rappelée chaque jour ; toutes les deux heures si les visiteurs
        # sont touchés.
        repeat_interval: 24h
        routes:
          - matchers:
              - severity = critical
            repeat_interval: 2h
      receivers:
        - name: email
          email_configs:
            - to: $(ALERT_RECIPIENT)
              from: *mailFrom
              smarthost: *smarthost
              require_tls: true
              auth_username: $(SMTP_USERNAME)
              auth_password_file: /etc/alertmanager/email/smtp-password
              send_resolved: true
              headers:
                Subject: '{{ template "rtgre.subject" . }}'
              text: '{{ template "rtgre.text" . }}'
              html: '{{ template "rtgre.html" . }}'
      templates:
        - /etc/alertmanager/config/*.tmpl
    # Le message : ce qui se passe, puis le lien vers le runbook.
    templateFiles:
      rtgre.tmpl: |-
        {{ define "rtgre.subject" -}}
        [rtgre] {{ if eq .Status "firing" }}Alerte{{ else }}Résolu{{ end }} : {{ .CommonLabels.alertname }}
        {{- end }}

        {{ define "rtgre.text" -}}
        {{ if eq .Status "firing" -}}
        Alerte : {{ .CommonLabels.alertname }}
        {{ range .Alerts.Firing }}
        {{ .Annotations.summary }}
        {{ .Annotations.description }}
        {{ end }}
        Que faire : {{ .CommonAnnotations.runbook_url }}
        {{- else -}}
        Résolu : {{ .CommonLabels.alertname }}
        {{ range .Alerts }}
        {{ .Annotations.summary }}
        {{- end }}
        {{- end }}
        {{- end }}

        {{ define "rtgre.html" -}}
        {{ if eq .Status "firing" -}}
        <p><strong>Alerte : {{ .CommonLabels.alertname }}</strong></p>
        {{ range .Alerts.Firing -}}
        <p>{{ .Annotations.summary }}<br>{{ .Annotations.description }}</p>
        {{ end -}}
        <p><a href="{{ .CommonAnnotations.runbook_url }}">Que faire</a></p>
        {{- else -}}
        <p><strong>Résolu : {{ .CommonLabels.alertname }}</strong></p>
        {{ range .Alerts -}}
        <p>{{ .Annotations.summary }}</p>
        {{ end -}}
        {{- end }}
        {{- end }}
    # Alertmanager ne parle pas à l'API de Kubernetes : il n'en reçoit aucun jeton.
    serviceAccount:
      automountServiceAccountToken: false
    alertmanagerSpec:
      automountServiceAccountToken: false
      # Les deux conteneurs qui préparent la configuration, au démarrage puis à chaque
      # changement, reçoivent les valeurs à y placer.
      initContainers:
        - name: init-config-reloader
          env: &emailEnv
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: *emailSecret
                  key: smtp-username
            - name: ALERT_RECIPIENT
              valueFrom:
                secretKeyRef:
                  name: *emailSecret
                  key: recipient
      containers:
        - name: config-reloader
          env: *emailEnv
      # Le mot de passe SMTP est lu dans un fichier : il n'entre pas dans la configuration.
      volumes:
        - name: email
          secret:
            secretName: *emailSecret
            items:
              - key: smtp-password
                path: smtp-password
      volumeMounts:
        - name: email
          mountPath: /etc/alertmanager/email
          readOnly: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 96Mi

  # Les règles par défaut du chart visent des composants que ce cluster n'expose pas : celles de
  # la plateforme sont écrites ici (files/alerts.yaml).
  defaultRules:
    create: false

  # node-exporter lit le système hôte : il a sa propre application et son propre espace de
  # noms, seul à être privilégié (kubernetes/node-exporter).
  nodeExporter:
    enabled: false

  # Avec kubeadm, ces composants n'exposent leurs métriques que sur la boucle locale du plan de
  # contrôle : Prometheus ne peut pas les joindre, et les ouvrir au réseau n'en vaut pas la peine.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  prometheusOperator:
    # Le certificat du webhook de validation vient de cert-manager, déjà là, plutôt que d'un
    # Job et d'une image de plus.
    admissionWebhooks:
      certManager:
        enabled: true
      patch:
        enabled: false
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 192Mi

  prometheus:
    prometheusSpec:
      # Conservation bornée en durée et en taille : le volume est sur le disque du nœud.
      retention: 15d
      retentionSize: 4GB
      scrapeInterval: 60s
      evaluationInterval: 60s
      # Toute cible déclarée dans le cluster est collectée, quel que soit son chart.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 100m
          memory: 384Mi
        limits:
          memory: 1Gi
      # Volume local déclaré dans kubernetes/storage/values.yaml (ADR 0011).
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: local
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
