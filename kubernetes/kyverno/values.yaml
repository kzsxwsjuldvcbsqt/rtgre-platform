# Les images sont contrôlées dans les espaces de noms qui portent cette étiquette. Elle se pose
# là où l'espace de noms est déclaré : namespaceLabels, dans kubernetes/apps/values.yaml.
verifiedNamespaces:
  label: &verifiedLabel rtgre.fr/verified-images
  value: &verifiedValue required

# Images admises dans ces espaces de noms sans signature : celles que leur éditeur ne signe pas.
# Les images à signature exigée, et leurs signataires, sont dans files/signed-images.txt. Tout
# autre dépôt est refusé.
unsignedImages:
  - docker.io/library/nginx

verification:
  # Délai laissé à Kyverno pour répondre à l'API de Kubernetes.
  timeoutSeconds: 20
  # Journal de transparence où chaque signature est inscrite. La preuve d'inscription voyage
  # avec la signature : Kyverno la vérifie sans l'interroger.
  transparencyLog: https://rekor.sigstore.dev

# Seuls noms que Kyverno peut joindre hors du cluster, en HTTPS : le registre des images signées,
# puis Sigstore, pour ses certificats racines.
egress:
  hosts:
    - ghcr.io
    - pkg-containers.githubusercontent.com
    - tuf-repo-cdn.sigstore.dev

# Valeurs du chart officiel kyverno (ADR 0019).
kyverno:
  # Seul le contrôleur d'admission est déployé : aucune politique ne génère, ne nettoie ni ne
  # rapporte.
  backgroundController:
    enabled: false
  cleanupController:
    enabled: false
  reportsController:
    enabled: false
  features:
    admissionReports:
      enabled: false
    aggregateReports:
      enabled: false
    policyReports:
      enabled: false
    validatingAdmissionPolicyReports:
      enabled: false
    backgroundScan:
      enabled: false
    # Aucune politique ne génère d'objet : le webhook qui protège leurs étiquettes est inutile.
    protectGenerationLabels:
      enabled: false

  # Tâches que Helm lancerait avant une installation, une mise à jour ou une suppression :
  # Argo CD n'installe pas par Helm, et ne les lancerait pas au bon moment. Ce cluster n'a
  # jamais eu de politique à l'ancien format, que la première chercherait.
  upgrade:
    legacyPolicyCheck:
      enabled: false
  crds:
    migration:
      enabled: false
  webhooksCleanup:
    enabled: false

  config:
    # Kyverno n'est appelé que pour les espaces de noms étiquetés. Ailleurs, sa panne ne bloque
    # rien.
    webhooks:
      namespaceSelector:
        matchExpressions:
          - key: *verifiedLabel
            operator: In
            values:
              - *verifiedValue

  admissionController:
    replicas: 1
    serviceMonitor:
      enabled: true
      interval: 60s
    # Mesuré à 57 Mo au repos, 67 Mo pendant les vérifications.
    container:
      resources:
        requests:
          cpu: 25m
          memory: 96Mi
        limits:
          memory: 256Mi
